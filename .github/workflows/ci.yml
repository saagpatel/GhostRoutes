name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate release resources
        run: |
          plutil -lint GhostRoutes/Resources/PrivacyInfo.xcprivacy
          plutil -lint ExportOptions.plist
      - name: Build release configuration
        run: |
          xcodebuild build -scheme GhostRoutes -project GhostRoutes.xcodeproj \
            -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$SIMULATOR_ID"
          xcodebuild test \
            -scheme GhostRoutes \
            -project GhostRoutes.xcodeproj \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            CODE_SIGNING_ALLOWED=NO
